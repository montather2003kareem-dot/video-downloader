<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحمّل الفيديوهات الشامل</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 480px; background-color: var(--card-bg); border-radius: 20px; padding: 24px; border: 1px solid var(--border-color); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        header { text-align: center; margin-bottom: 22px; }
        header h1 { font-size: 1.4rem; margin-bottom: 6px; }
        header p { font-size: 0.85rem; color: var(--text-sub); }
        input[type="text"] { width: 100%; padding: 13px; border-radius: 12px; background-color: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); font-size: 0.95rem; direction: ltr; text-align: left; outline: none; margin-bottom: 12px; }
        .btn { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .result-box { margin-top: 20px; display: none; text-align: center; }
        .result-box.show { display: block; }
        .video-preview { width: 100%; max-height: 250px; border-radius: 12px; background: black; margin-bottom: 12px; }
        .download-btn { display: block; width: 100%; padding: 14px; background-color: var(--success); color: white; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 1rem; border: none; cursor: pointer; }
        .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 12px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>مُحمّل الفيديوهات السحابي</h1>
        <p>تيك توك، إنستغرام، يوتيوب، فيسبوك، إكس</p>
    </header>

    <input type="text" id="urlInput" placeholder="https://..." autocomplete="off">
    <button class="btn" id="fetchBtn" onclick="downloadVideo()">استخراج الفيديو</button>
    <div class="error-msg" id="errorMsg"></div>

    <div class="result-box" id="resultBox">
        <video id="player" class="video-preview" controls playsinline></video>
        <p id="videoTitle" style="font-size: 0.85rem; margin-bottom: 12px; color: #cbd5e1;"></p>
        <button class="download-btn" onclick="saveVideo()">📥 حفظ الفيديو في الصور</button>
    </div>
</div>

<script>
    let activeDownloadUrl = "";
    let activeTitle = "فيديو";

    async function downloadVideo() {
        const url = document.getElementById('urlInput').value.trim();
        const btn = document.getElementById('fetchBtn');
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');
        const player = document.getElementById('player');
        const titleEl = document.getElementById('videoTitle');

        if (!url) return;

        errorMsg.style.display = "none";
        resultBox.classList.remove("show");
        btn.disabled = true;
        btn.textContent = "جاري السحب من السيرفر...";

        try {
            const response = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();

            if (data.success && data.download_url) {
                activeDownloadUrl = data.download_url;
                activeTitle = data.title;
                player.src = data.download_url;
                titleEl.textContent = data.title;
                resultBox.classList.add("show");
            } else {
                errorMsg.textContent = data.message || "تعذر استخراج الفيديو";
                errorMsg.style.display = "block";
            }
        } catch (e) {
            errorMsg.textContent = "حدث خطأ في الاتصال بالسيرفر";
            errorMsg.style.display = "block";
        } finally {
            btn.disabled = false;
            btn.textContent = "استخراج الفيديو";
        }
    }

    async function saveVideo() {
        if (!activeDownloadUrl) return;
        try {
            const res = await fetch(activeDownloadUrl);
            const blob = await res.blob();
            const file = new File([blob], "video.mp4", { type: "video/mp4" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: activeTitle });
            } else {
                window.location.href = activeDownloadUrl;
            }
        } catch (err) {
            window.location.href = activeDownloadUrl;
        }
    }
</script>

</body>
</html>
